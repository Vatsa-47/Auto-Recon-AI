# Server Configuration
server.port=${SERVER_PORT:8080}
spring.application.name=auto-recon-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:auto_recon}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:autorecon_app}
spring.datasource.password=${DB_PASSWORD:autorecon_secure_password_2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Multipart File Upload Limits (Forensic Files, Video & Telemetry)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Custom Forensic Evidence Storage Path
autorecon.storage.dir=${AUTORECON_STORAGE_DIR:storage}

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
